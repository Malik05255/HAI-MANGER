name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HAI_KEYSTORE_B64: ${{ secrets.HAI_KEYSTORE_B64 }}
  HAI_KEYSTORE_PASSWORD: ${{ secrets.HAI_KEYSTORE_PASSWORD }}
  HAI_KEYSTORE_PATH: ${{ github.workspace }}/.signing/hai-release.jks
  EXPECTED_SIGNING_CERT_SHA256: D59B0F985ED8CF4A903938B7904A5F33EDA01E8817E994B6A20D78D164BC2441

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 SDK packages
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Restore release signing key
        if: env.HAI_KEYSTORE_B64 != '' && env.HAI_KEYSTORE_PASSWORD != ''
        run: |
          mkdir -p .signing
          printf '%s' "$HAI_KEYSTORE_B64" | base64 --decode > "$HAI_KEYSTORE_PATH"
          chmod 600 "$HAI_KEYSTORE_PATH"

      - name: Validate release signing key
        if: env.HAI_KEYSTORE_B64 != '' && env.HAI_KEYSTORE_PASSWORD != ''
        run: |
          KEYSTORE_CERT=$(keytool -list -v \
            -keystore "$HAI_KEYSTORE_PATH" \
            -storepass "$HAI_KEYSTORE_PASSWORD" \
            -alias hai_manager \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | head -n1 \
            | tr -d ':' \
            | tr '[:lower:]' '[:upper:]')
          echo "Keystore certificate: $KEYSTORE_CERT"
          test "$KEYSTORE_CERT" = "$EXPECTED_SIGNING_CERT_SHA256"

          mkdir -p .signing/check
          echo ok > .signing/check/payload.txt
          (cd .signing/check && zip -q check.jar payload.txt)
          jarsigner \
            -keystore "$HAI_KEYSTORE_PATH" \
            -storepass "$HAI_KEYSTORE_PASSWORD" \
            -keypass "$HAI_KEYSTORE_PASSWORD" \
            .signing/check/check.jar hai_manager >/dev/null
          jarsigner -verify .signing/check/check.jar >/dev/null
          rm -rf .signing/check

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Run lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build signed release APK
        if: env.HAI_KEYSTORE_B64 != '' && env.HAI_KEYSTORE_PASSWORD != ''
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify release signing certificate
        if: env.HAI_KEYSTORE_B64 != '' && env.HAI_KEYSTORE_PASSWORD != ''
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          VERIFY_OUTPUT=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK" 2>&1)
          printf '%s\n' "$VERIFY_OUTPUT"
          NORMALIZED_OUTPUT=$(printf '%s' "$VERIFY_OUTPUT" \
            | tr -d '[:space:]:' \
            | tr '[:lower:]' '[:upper:]')
          if ! printf '%s' "$NORMALIZED_OUTPUT" | grep -q "$EXPECTED_SIGNING_CERT_SHA256"; then
            echo "::error::The APK is signed, but its certificate does not match the permanent HAI MANAGER release certificate."
            exit 1
          fi
          echo "Release certificate verified: $EXPECTED_SIGNING_CERT_SHA256"

      - name: Prepare signed update release
        if: github.event_name != 'pull_request' && env.HAI_KEYSTORE_B64 != '' && env.HAI_KEYSTORE_PASSWORD != ''
        run: |
          mkdir -p dist
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          cp "$SOURCE_APK" dist/HAI-MANAGER.apk
          VERSION_CODE=$(grep -m1 'versionCode = ' app/build.gradle.kts | sed -E 's/.*versionCode = ([0-9]+).*/\1/')
          VERSION_NAME=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          CATALOG_VERSION=$(grep -m1 '"catalogVersion"' device-catalog.json | sed -E 's/.*: *([0-9]+).*/\1/')
          SHA256=$(sha256sum dist/HAI-MANAGER.apk | awk '{print toupper($1)}')
          PUBLISHED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          cat > dist/update-feed.json <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apkUrl": "https://github.com/Malik05255/HAI-MANGER/releases/download/beta/HAI-MANAGER.apk",
            "notes": "IMEI Unlock Lab: Huawei V1/V2/V201/Flash، ZTE ZX297520V3، وتصنيف آمن للأجيال الحديثة 4G/5G بدون أكواد تخمينية.",
            "mandatory": false,
            "signatureStable": true,
            "signingCertSha256": "$EXPECTED_SIGNING_CERT_SHA256",
            "sha256": "$SHA256",
            "channel": "beta",
            "publishedAt": "$PUBLISHED_AT",
            "catalogVersion": $CATALOG_VERSION
          }
          EOF

      - name: Publish signed beta release
        if: github.event_name != 'pull_request' && env.HAI_KEYSTORE_B64 != '' && env.HAI_KEYSTORE_PASSWORD != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          gh release delete beta --yes || true
          git tag -f beta "$GITHUB_SHA"
          git push origin refs/tags/beta --force
          gh release create beta dist/HAI-MANAGER.apk dist/update-feed.json \
            --title "HAI MANAGER Beta $VERSION_NAME" \
            --prerelease \
            --notes "HAI MANAGER $VERSION_NAME — signed automated beta build from $GITHUB_SHA"

      - name: Publish legacy update feed for old clients
        if: github.event_name != 'pull_request' && env.HAI_KEYSTORE_B64 != '' && env.HAI_KEYSTORE_PASSWORD != ''
        run: |
          cp dist/update-feed.json update-feed.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update-feed.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish signed update feed [skip ci]"
            git push origin HEAD:main
          fi

      - name: Warn when release signing is not configured
        if: github.event_name != 'pull_request' && (env.HAI_KEYSTORE_B64 == '' || env.HAI_KEYSTORE_PASSWORD == '')
        run: |
          echo "::warning::Release signing secrets are missing. Debug APK is built for testing only; no installable update is published."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HAI-MANAGER-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed release APK artifact
        if: env.HAI_KEYSTORE_B64 != '' && env.HAI_KEYSTORE_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: HAI-MANAGER-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

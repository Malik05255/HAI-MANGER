name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HAI_KEYSTORE_B64: ${{ secrets.HAI_KEYSTORE_B64 }}
  HAI_KEYSTORE_PASSWORD: ${{ secrets.HAI_KEYSTORE_PASSWORD }}
  HAI_KEY_ALIAS: ${{ secrets.HAI_KEY_ALIAS }}
  HAI_KEY_PASSWORD: ${{ secrets.HAI_KEY_PASSWORD }}
  HAI_KEYSTORE_PATH: ${{ github.workspace }}/.signing/hai-release.jks
  EXPECTED_SIGNING_CERT_SHA256: BE6D46C373883309CA8E5EA8DDC11CE02339352C4D690EF74387CEA8275E7DF2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 SDK packages
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Restore release signing key
        if: env.HAI_KEYSTORE_B64 != ''
        run: |
          mkdir -p .signing
          echo "$HAI_KEYSTORE_B64" | base64 --decode > "$HAI_KEYSTORE_PATH"
          chmod 600 "$HAI_KEYSTORE_PATH"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Run lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build signed release APK
        if: env.HAI_KEYSTORE_B64 != ''
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify release signing certificate
        if: env.HAI_KEYSTORE_B64 != ''
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          CERT_SHA256=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n1 \
            | tr -d ':' \
            | tr '[:lower:]' '[:upper:]')
          echo "Release certificate: $CERT_SHA256"
          test "$CERT_SHA256" = "$EXPECTED_SIGNING_CERT_SHA256"

      - name: Prepare signed update release
        if: github.event_name != 'pull_request' && env.HAI_KEYSTORE_B64 != ''
        run: |
          mkdir -p dist
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          cp "$SOURCE_APK" dist/HAI-MANAGER.apk
          VERSION_CODE=$(grep -m1 'versionCode = ' app/build.gradle.kts | sed -E 's/.*versionCode = ([0-9]+).*/\1/')
          VERSION_NAME=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          SHA256=$(sha256sum dist/HAI-MANAGER.apk | awk '{print toupper($1)}')
          PUBLISHED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          cat > dist/update-feed.json <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apkUrl": "https://github.com/Malik05255/HAI-MANGER/releases/download/beta/HAI-MANAGER.apk",
            "notes": "تحديث موقع بمفتاح HAI MANAGER الثابت، مع تحسينات التحديثات وإدارة الراوتر.",
            "mandatory": false,
            "signatureStable": true,
            "signingCertSha256": "$EXPECTED_SIGNING_CERT_SHA256",
            "sha256": "$SHA256",
            "channel": "beta",
            "publishedAt": "$PUBLISHED_AT",
            "catalogVersion": 2
          }
          EOF

      - name: Publish signed beta release
        if: github.event_name != 'pull_request' && env.HAI_KEYSTORE_B64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete beta --yes || true
          git tag -f beta "$GITHUB_SHA"
          git push origin refs/tags/beta --force
          gh release create beta dist/HAI-MANAGER.apk dist/update-feed.json \
            --title "HAI MANAGER Beta" \
            --prerelease \
            --notes "Signed automated beta build from $GITHUB_SHA"

      - name: Publish legacy update feed for old clients
        if: github.event_name != 'pull_request' && env.HAI_KEYSTORE_B64 != ''
        run: |
          cp dist/update-feed.json update-feed.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update-feed.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish signed update feed [skip ci]"
            git push origin HEAD:main
          fi

      - name: Warn when release signing is not configured
        if: github.event_name != 'pull_request' && env.HAI_KEYSTORE_B64 == ''
        run: |
          echo "::warning::Release signing secrets are missing. Debug APK is built for testing only; no installable update is published."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HAI-MANAGER-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed release APK artifact
        if: env.HAI_KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: HAI-MANAGER-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
